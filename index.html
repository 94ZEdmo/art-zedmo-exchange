<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ART ZEDMO EXCHANGE - V4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#070a0f;color:#fff;padding:16px;padding-bottom:100px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{color:#00ffb4;font-weight:900;letter-spacing:2px;font-size:18px}
.card{background:#121821;border:1px solid #1e2a36;border-radius:20px;padding:18px;margin-bottom:14px}
.solde{color:#6b7f8f;font-size:12px;text-align:center}
.total{font-size:30px;font-weight:900;text-align:center;margin:6px 0}
.crypto-row{display:flex;gap:8px;overflow-x:auto}
.crypto{background:#121821;padding:12px 16px;border-radius:14px;min-width:115px;border:1px solid #1e2a36;cursor:pointer}
.crypto.active{border-color:#00ffb4;background:rgba(0,255,180,0.1)}
.crypto span{font-size:10px;color:#6b7f8f}
.crypto b{display:block;font-size:13px;margin-top:3px}
.tabs{display:flex;background:#121821;border-radius:30px;padding:4px;border:1px solid #1e2a36}
.tabs button{flex:1;padding:12px;border:none;border-radius:24px;font-weight:800;cursor:pointer}
.tabs.on{background:#00ffb4;color:#000}
.tabs.off{background:transparent;color:#6b7f8f}
.label{font-size:12px;color:#6b7f8f;margin:14px 0 8px;display:block}
.mm{display:flex;flex-wrap:wrap;gap:8px}
.mm button{padding:9px 14px;border-radius:22px;border:1px solid #1e2a36;background:#121821;color:#fff;font-size:12px;cursor:pointer}
.mm button.active{background:#fff;color:#000;font-weight:700}
.input-row{display:flex;gap:8px;margin-top:10px}
.badge{background:#1e2a36;color:#fff;padding:12px 14px;border-radius:14px;font-size:12px;font-weight:800;min-width:70px;text-align:center;display:flex;align-items:center;justify-content:center}
.input{flex:1;background:#0a0e14;border:1px solid #1e2a36;border-radius:14px;padding:14px;color:#fff;font-size:16px;outline:none;width:100%}
.net{display:flex;gap:8px;margin-top:10px}
.net button{padding:8px 14px;border-radius:20px;border:1px solid #1e2a36;background:#121821;color:#6b7f8f;font-size:11px;font-weight:700;cursor:pointer}
.net button.active{background:#00ffb4;color:#000;border-color:#00ffb4}
.btn-main{width:100%;background:#00ffb4;color:#000;border:none;padding:16px;border-radius:16px;font-weight:900;font-size:16px;margin-top:16px;cursor:pointer}
.select{flex:1;background:#0a0e14;border:1px solid #1e2a36;border-radius:14px;padding:14px;color:#fff;font-size:15px;outline:none}
.convert{text-align:center;margin:14px 0;color:#00ffb4;font-weight:700;font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0e141e;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #1e2a36}
.nav span{font-size:10px;display:flex;flex-direction:column;align-items:center;color:#4a5a6a}
.nav span.active{color:#00ffb4}
</style>
</head>
<body>
<div class="header"><div class="logo">ART ZEDMO</div><div>🔔</div></div>
<div class="card">
<div class="solde">SOLDE TOTAL</div>
<div class="total">3 161 053 FCFA</div>
<div class="crypto-row">
<div class="crypto active" onclick="setCrypto('USDT')"><span>USDT</span><b>605 FCFA</b></div>
<div class="crypto" onclick="setCrypto('BTC')"><span>BTC</span><b>62M FCFA</b></div>
<div class="crypto" onclick="setCrypto('ETH')"><span>ETH</span><b>2.1M FCFA</b></div>
</div>
</div>
<div class="card">
<div class="tabs"><button id="btnBuy" class="on" onclick="setMode('buy')">Acheter</button><button id="btnSell" class="off" onclick="setMode('sell')">Vendre</button></div>
<span class="label">📱 Mode de paiement</span>
<div class="mm">
<button class="active" onclick="setMM('Orange Money')">🟠 Orange</button>
<button onclick="setMM('MTN MoMo')">🟡 MTN</button>
<button onclick="setMM('Wave')">🔵 Wave</button>
<button onclick="setMM('Moov Money')">🔵 Moov</button>
</div>
<div class="input-row">
<div class="badge">+229</div>
<input id="phone" class="input" value="97 12 34 56" placeholder="Numéro">
</div>
<span class="label" id="labelPay">Vous payez (FCFA)</span>
<div class="input-row">
<div class="badge">CFA</div>
<input id="amount" class="input" type="number" value="50000" oninput="calc()">
</div>
<div style="text-align:center;margin:12px 0;color:#1e2a36">↕</div>
<span class="label">Vous recevez</span>
<div class="input-row">
<select id="cryptoSelect" class="select" onchange="setCrypto(this.value)"><option value="USDT" selected>USDT - Tether</option><option value="BTC">BTC - Bitcoin</option><option value="ETH">ETH - Ethereum</option></select>
</div>
<div class="input-row" style="margin-top:8px">
<input id="cryptoAmount" class="input" value="81,40" oninput="calcReverse()">
</div>
<div class="net">
<button class="active" onclick="setNet(this,'TRC20')">TRC20</button>
<button onclick="setNet(this,'ERC20')">ERC20</button>
<button onclick="setNet(this,'BEP20')">BEP20</button>
</div>
<div class="convert" id="rateTxt">1 USDT = 605 FCFA | TRC20</div>
<button class="btn-main" onclick="order()" id="mainBtn">Confirmer</button>
</div>
<div class="nav"><span class="active">↕ Échange</span><span>💼 Portefeuille</span><span>🕒 Historique</span><span>👤 Profil</span></div>
<script>
let crypto='USDT', mode='buy', mm='Orange Money', network='TRC20';
const rates={USDT:605,BTC:62000000,ETH:2100000};
function setCrypto(c){
 crypto=c; document.getElementById('cryptoSelect').value=c;
 document.querySelectorAll('.crypto').forEach(e=>e.classList.toggle('active', e.innerText.includes(c)));
 calc();
}
function setMode(m){
 mode=m;
 document.getElementById('btnBuy').className=m==='buy'?'on':'off';
 document.getElementById('btnSell').className=m==='sell'?'on':'off';
 calc();
}
function setMM(m){ mm=m; document.querySelectorAll('.mm button').forEach(b=>b.classList.remove('active')); event.currentTarget.classList.add('active');}
function setNet(el,n){ network=n; document.querySelectorAll('.net button').forEach(b=>b.classList.remove('active')); el.classList.add('active'); document.getElementById('rateTxt').innerText=`1 ${crypto} = ${rates[crypto].toLocaleString()} FCFA | ${network}`;}
function calc(){
 let amt=parseFloat(document.getElementById('amount').value)||0;
 let res=amt/rates[crypto];
 document.getElementById('cryptoAmount').value=res.toFixed(2).replace('.',',');
 document.getElementById('rateTxt').innerText=`1 ${crypto} = ${rates[crypto].toLocaleString()} FCFA | ${network}`;
}
function calcReverse(){
 let v=parseFloat(document.getElementById('cryptoAmount').value.replace(',','.'))||0;
 document.getElementById('amount').value=Math.round(v*rates[crypto]);
}
function order(){
 let amt=document.getElementById('amount').value;
 let camount=document.getElementById('cryptoAmount').value;
 let phone=document.getElementById('phone').value;
 let msg=`Bonjour ART ZEDMO,%0AJe veux ${mode==='buy'?'ACHETER':'VENDRE'}:%0A- ${amt} FCFA%0A- Reçois: ${camount} ${crypto} (${network})%0A- Via: ${mm}%0A- Num: +229 ${phone}`;
 window.open(`https://wa.me/22997123456?text=${msg}`,'_blank');
}
calc();
</script>
</body>
 </html>
